services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pursuit
      POSTGRES_PASSWORD: pursuit
      POSTGRES_DB: pursuit
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
